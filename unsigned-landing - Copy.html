<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsigned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0A12;
    --depth:#14141F;
    --paper:#EDEDF4;
    --mist:#9A9AB0;
    --violet:#8B5CF6;
    --cyan:#22D3C7;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Manrope', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:var(--void);
    color:var(--paper);
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:32px 20px;
    overflow:hidden;
  }

  .aurora{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .aurora::before{
    content:""; position:absolute; width:60vw; height:60vw;
    border-radius:50%; filter: blur(120px); opacity:0.25;
    background: radial-gradient(circle, var(--violet), transparent 70%);
    top:-10%; left:-10%;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 600px;
    gap: 24px;
  }
  
  .mono-tag {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cyan);
    background: rgba(34, 211, 199, 0.1);
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(34, 211, 199, 0.2);
  }

  .hero-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 52px;
    line-height: 1.1;
  }

  .hero-subtitle {
    font-size: 18px;
    line-height: 1.6;
    color: var(--mist);
  }

  .enter-btn {
    padding: 16px 34px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--violet) 0%, #6D4FC4 100%);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 12px 30px -10px rgba(139,92,246,0.55);
    transition: transform 0.2s ease;
  }
  
  .enter-btn:hover { 
    transform: translateY(-2px); 
  }
</style>
</head>
<body>

  <div class="aurora"></div>

  <div class="container">
    <div class="mono-tag">Secure Protocol v1.0</div>
    <h1 class="hero-title">Unsigned</h1>
    <p class="hero-subtitle">No names. No logs. No trace. A network built for complete anonymity.</p>
    
    <button id="enterBtn" class="enter-btn">
      Initialize Connection
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>

<script>
  document.getElementById('enterBtn').addEventListener('click', function() {
    // Opens your exact login file
    window.location.href = 'unsigned-auth.html';
  });
</script>

</body>
</html>
