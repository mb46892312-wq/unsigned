<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsigned — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0A12;
    --depth:#14141F;
    --depth-2:#1B1B2A;
    --hairline: rgba(237,237,244,0.09);
    --hairline-strong: rgba(237,237,244,0.16);
    --paper:#EDEDF4;
    --mist:#9A9AB0;
    --mist-dim:#5E5E74;
    --violet:#8B5CF6;
    --violet-soft:#B8A2FF;
    --cyan:#22D3C7;
    --coral:#FF6B6B;
    --amber:#F5B942;

    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Manrope', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  html{ color-scheme:dark; }
  body{
    background:var(--void);
    color:var(--paper);
    font-family:var(--font-body);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  button{ font-family:inherit; }

  /* ---------- header ---------- */
  .chat-header{
    flex-shrink:0;
    display:flex; align-items:center; gap:14px;
    padding:14px 22px;
    border-bottom:1px solid var(--hairline);
    background:rgba(10,10,18,0.9);
    backdrop-filter: blur(14px);
  }
  .back-btn{
    display:flex; align-items:center; gap:6px;
    color:var(--mist);
    font-size:12.5px;
    font-weight:600;
    border:none; background:transparent; cursor:pointer;
    padding:8px; margin-left:-8px;
    border-radius:8px;
    transition: color .15s ease, background .15s ease;
  }
  .back-btn:hover{ color:var(--paper); background:var(--depth); }
  .back-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .back-btn svg{ width:16px; height:16px; }

  .header-divider{ width:1px; height:26px; background:var(--hairline-strong); }

  .group-icon-lg{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    background:rgba(34,211,199,0.14);
    color:var(--cyan);
    display:flex; align-items:center; justify-content:center;
  }
  .group-icon-lg svg{ width:18px; height:18px; }

  .header-titles{ flex:1; min-width:0; }
  .header-titles h1{
    font-family:var(--font-display);
    font-size:15.5px;
    font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .header-titles .live-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--cyan);
    font-weight:500;
  }
  .header-titles .live-badge i{
    width:5px; height:5px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 6px var(--cyan);
  }
  .header-titles p{
    margin-top:2px;
    font-size:11.5px;
    color:var(--mist-dim);
  }

  .header-actions{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    width:36px; height:36px;
    border-radius:9px;
    border:1px solid var(--hairline-strong);
    background:var(--depth);
    color:var(--mist);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .icon-btn:hover{ border-color:var(--violet); color:var(--violet-soft); }
  .icon-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .icon-btn svg{ width:16px; height:16px; }

  /* ---------- guideline banner ---------- */
  .banner{
    flex-shrink:0;
    display:flex; align-items:center; gap:10px;
    padding:10px 22px;
    background: linear-gradient(90deg, rgba(139,92,246,0.12), rgba(34,211,199,0.06));
    border-bottom:1px solid var(--hairline);
    font-size:12px;
    color:var(--mist);
  }
  .banner svg{ width:14px; height:14px; color:var(--violet-soft); flex-shrink:0; }
  .banner b{ color:var(--paper); font-weight:600; }
  .banner .close{
    margin-left:auto;
    border:none; background:transparent; color:var(--mist-dim);
    cursor:pointer; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
  }
  .banner .close:hover{ color:var(--mist); background:rgba(255,255,255,0.06); }
  .banner.hidden{ display:none; }

  /* ---------- thread ---------- */
  .thread{
    flex:1;
    overflow-y:auto;
    padding:22px 22px 10px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .thread::-webkit-scrollbar{ width:8px; }
  .thread::-webkit-scrollbar-thumb{ background:var(--hairline-strong); border-radius:8px; }
  .thread::-webkit-scrollbar-track{ background:transparent; }

  .day-divider{
    display:flex; align-items:center; gap:12px;
    color:var(--mist-dim);
    font-size:11px;
    font-family:var(--font-mono);
    margin:6px 0;
  }
  .day-divider::before, .day-divider::after{
    content:""; flex:1; height:1px; background:var(--hairline);
  }

  .msg-row{
    display:flex;
    gap:11px;
    max-width:640px;
  }
  .msg-row.own{
    align-self:flex-end;
    flex-direction:row-reverse;
  }

  .glyph-mini{
    width:32px; height:32px; border-radius:9px; overflow:hidden; flex-shrink:0;
    border:1px solid var(--hairline-strong);
    margin-top:2px;
  }

  .msg-col{ min-width:0; flex:1; }
  .msg-row.own .msg-col{ display:flex; flex-direction:column; align-items:flex-end; }

  .msg-meta{
    display:flex; align-items:baseline; gap:8px;
    margin-bottom:5px;
  }
  .msg-meta .tag{
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:500;
  }
  .msg-meta .time{
    font-size:10.5px;
    color:var(--mist-dim);
  }

  .msg-bubble{
    position:relative;
    display:inline-block;
    background:var(--depth);
    border:1px solid var(--hairline);
    border-radius:14px 14px 14px 4px;
    padding:11px 14px;
    font-size:13.8px;
    line-height:1.55;
    color:var(--paper);
    word-break:break-word;
  }
  .msg-row.own .msg-bubble{
    background: linear-gradient(135deg, var(--violet) 0%, #6D4FC4 100%);
    border-color:transparent;
    border-radius:14px 14px 4px 14px;
    color:#fff;
  }

  .report-btn{
    align-self:flex-start;
    margin-top:8px;
    width:26px; height:26px;
    border-radius:7px;
    border:1px solid var(--hairline-strong);
    background:var(--depth);
    color:var(--mist-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0;
    transition: opacity .15s ease, color .15s ease, border-color .15s ease;
  }
  .msg-row:hover .report-btn{ opacity:1; }
  .report-btn:hover{ color:var(--coral); border-color:var(--coral); }
  .report-btn:focus-visible{ opacity:1; outline:2px solid var(--cyan); outline-offset:2px; }
  .report-btn svg{ width:13px; height:13px; }

  /* ---------- composer ---------- */
  .composer-wrap{
    flex-shrink:0;
    padding:14px 22px 18px;
    border-top:1px solid var(--hairline);
    background:rgba(10,10,18,0.9);
  }
  .composer{
    display:flex; align-items:flex-end; gap:10px;
    background:var(--depth);
    border:1px solid var(--hairline-strong);
    border-radius:14px;
    padding:9px 9px 9px 15px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .composer:focus-within{
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(139,92,246,0.16);
  }
  .composer textarea{
    flex:1;
    background:transparent;
    border:none;
    resize:none;
    color:var(--paper);
    font-family:var(--font-body);
    font-size:13.8px;
    line-height:1.5;
    max-height:120px;
    padding:8px 0;
  }
  .composer textarea:focus{ outline:none; }
  .composer textarea::placeholder{ color:var(--mist-dim); }

  .composer .attach-btn{
    flex-shrink:0;
    width:36px; height:36px;
    border-radius:10px;
    border:none;
    background:transparent;
    color:var(--mist);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: color .15s ease, background .15s ease;
  }
  .composer .attach-btn:hover{ color:var(--violet-soft); background:rgba(139,92,246,0.1); }
  .composer .attach-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .composer .attach-btn svg{ width:18px; height:18px; }

  .send-btn{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:10px;
    border:none;
    background: linear-gradient(135deg, var(--violet) 0%, #6D4FC4 100%);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .15s ease, opacity .15s ease;
  }
  .send-btn:hover{ transform:translateY(-1px) translateX(1px); }
  .send-btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  .send-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .send-btn svg{ width:16px; height:16px; }

  .composer-footnote{
    margin-top:9px;
    font-size:10.8px;
    color:var(--mist-dim);
    display:flex; align-items:center; gap:6px;
  }
  .composer-footnote svg{ width:11px; height:11px; }

  @media (max-width:640px){
    .chat-header{ padding:12px 14px; }
    .header-titles p{ display:none; }
    .thread{ padding:16px 14px 8px; }
    .composer-wrap{ padding:12px 14px 14px; }
    .msg-row{ max-width:88%; }
  }
</style>
</head>
<body>

  <header class="chat-header">
    <button class="back-btn" onclick="window.location.href='unsigned-dashboard.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Unsigned
    </button>
    <div class="header-divider"></div>
    <div class="group-icon-lg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>
    <div class="header-titles">
      <h1 id="roomTitle">Loading Room... <span class="live-badge"><i></i>Live</span></h1>
      <p>Anonymous, department-wide. No names — theirs or yours.</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" type="button" aria-label="Search this channel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Channel info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-4Z"/></svg>
    <span><b>Feedback, not personal attacks.</b> Keep it about the course, not a person. Reports are reviewed within 24h.</span>
    <button class="close" id="bannerClose" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <main class="thread" id="thread">
    <div class="day-divider">Today</div>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <button class="attach-btn" type="button" aria-label="Attach a file" id="attachBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95L9.41 17.42a1.5 1.5 0 0 1-2.12-2.12l8.49-8.49"/></svg>
      </button>
      <textarea id="msgInput" rows="1" placeholder="Message this channel — sent unsigned"></textarea>
      <button class="send-btn" type="button" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="composer-footnote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Metadata is stripped before sending. Your device identity is attached — nothing else.
    </div>
  </div>

  <!-- Firebase CDN Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // 1. Firebase Initialization
    const firebaseConfig = {
      apiKey: "AIzaSyAfrT12DMOws7MMZ-E6BX7dDLjvhbkbmtE",
      authDomain: "project-nox-507c2.firebaseapp.com",
      projectId: "project-nox-507c2",
      databaseURL: "https://project-nox-507c2-default-rtdb.firebaseio.com",
      storageBucket: "project-nox-507c2.firebasestorage.app",
      messagingSenderId: "34710353975",
      appId: "1:34710353975:web:38b006fa895a942b1467b2"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 2. Identity & Avatar SVG Generator (Unchanged)
    const GRADIENTS = [
      ['#8B5CF6', '#22D3C7'], ['#8B5CF6', '#FF6B6B'], ['#22D3C7', '#6C8CFF'],
      ['#F5B942', '#FF6B6B'], ['#22D3C7', '#8B5CF6'],
    ];
    function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619);} return h>>>0; }
    function rngFromSeed(seed){ let a=seed>>>0; return function(){ a^=a<<13; a>>>=0; a^=a>>>17; a^=a<<5; a>>>=0; return (a>>>0)/4294967296; }; }
    function glyphSVG(seed, size=32){
      const rnd = rngFromSeed(hashStr(seed+'::glyph'));
      const grid=5, half=3, cell=size/grid;
      const [c1,c2] = GRADIENTS[Math.floor(rnd()*GRADIENTS.length)];
      const gid='g'+Math.floor(rnd()*1e6);
      let cells='';
      for(let y=0;y<grid;y++){ for(let x=0;x<half;x++){
        const on = rnd() > 0.56; if(!on) continue;
        const mx = grid-1-x;
        cells += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" rx="${cell*0.24}" fill="url(#${gid})"/>`;
        if (mx!==x) cells += `<rect x="${mx*cell}" y="${y*cell}" width="${cell}" height="${cell}" rx="${cell*0.24}" fill="url(#${gid})"/>`;
      }}
      return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
        <rect width="${size}" height="${size}" fill="#1B1B2A"/>${cells}</svg>`;
    }
    function tagColor(seed){
      const rnd = rngFromSeed(hashStr(seed+'::glyph'));
      const pair = GRADIENTS[Math.floor(rnd()*GRADIENTS.length)];
      return pair[0];
    }

    // 3. Device Session Identification
    let currentUserId = localStorage.getItem('nox_chat_uid');
    if (!currentUserId) {
      currentUserId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('nox_chat_uid', currentUserId);
    }

    // --- NEW SEPARATE ROOM LOGIC ---
    // Grabs the room name from the URL, or defaults to 'General' if no room is specified
    const urlParams = new URLSearchParams(window.location.search);
    const currentRoom = urlParams.get('room') || 'General';
    
    // Updates the visual header text so you know which room you are in
    const formattedRoomName = (currentRoom.charAt(0).toUpperCase() + currentRoom.slice(1)).replace('-', ' ');
    document.getElementById('roomTitle').innerHTML = `${formattedRoomName} <span class="live-badge"><i></i>Live</span>`;
    
    // Tells Firebase to use a specific folder for this room instead of one giant 'messages' pile
    const roomRef = database.ref('channels/' + currentRoom.toLowerCase());
    // -------------------------------

    const thread = document.getElementById('thread');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const reportSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';

    // Custom UI Bubble Renderer
    function renderMessage(m){
      const rowClass = m.own ? 'msg-row own' : 'msg-row';
      const glyph = `<div class="glyph-mini">${glyphSVG(m.seed, 32)}</div>`;
      const tagHtml = m.own ? '' : `<span class="tag" style="color:${tagColor(m.seed)}">${m.tag}</span>`;
      const reportBtn = m.own ? '' : `<button class="report-btn" aria-label="Report this message">${reportSVG}</button>`;

      return `
        <div class="${rowClass}">
          ${glyph}
          <div class="msg-col">
            <div class="msg-meta">
              ${tagHtml}
              <span class="time">${m.time}</span>
            </div>
            <div class="msg-bubble">${m.text}</div>
            ${reportBtn}
          </div>
        </div>`;
    }

    // 4. Send Message Handler
    function sendMessage(){
      const text = input.value.trim();
      if (!text) return;

      // Pushes the message directly into the SPECIFIC ROOM folder
      roomRef.push({
        senderId: currentUserId,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });

      input.value = '';
      input.style.height = 'auto';
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    // 5. Firebase Real-Time Stream (Reads from the specific room folder!)
    roomRef.limitToLast(100).on('child_added', (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.text) return;

      const isMe = data.senderId === currentUserId;
      const formattedTime = data.timestamp 
        ? new Date(data.timestamp).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })
        : 'Just now';

      const html = renderMessage({
        seed: data.senderId,
        tag: isMe ? 'you' : data.senderId.substring(0, 8),
        time: formattedTime,
        own: isMe,
        text: data.text
      });

      thread.insertAdjacentHTML('beforeend', html);
      thread.scrollTop = thread.scrollHeight;
    });

    // Optional UI interactions
    document.getElementById('bannerClose')?.addEventListener('click', () => {
      document.getElementById('banner')?.classList.add('hidden');
    });

    document.getElementById('attachBtn')?.addEventListener('click', () => {
      alert('Attach a file to send with this message — stripped of metadata before it goes out.');
    });
  </script>
</body>
</html>
