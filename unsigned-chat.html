<!DOCTYPE html>
<html lang="en">`
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsigned — Live Chat Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase App SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<!-- Firebase Realtime Database SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  :root{
    --void:#0A0A12;
    --depth:#14141F;
    --hairline: rgba(237,237,244,0.09);
    --hairline-strong: rgba(237,237,244,0.16);
    --paper:#EDEDF4;
    --mist:#9A9AB0;
    --mist-dim:#5E5E74;
    --violet:#8B5CF6;
    --cyan:#22D3C7;
    --coral:#FF6B6B;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Manrope', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--void); color:var(--paper); font-family:var(--font-body); height:100vh; display:flex; flex-direction:column; }

  .chat-header{
    padding:16px 24px; background:rgba(10,10,18,0.9); border-bottom:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:space-between;
  }
  .header-actions{ display:flex; align-items:center; gap:12px; }
  .back-btn, .clear-btn{
    color:var(--mist); text-decoration:none; font-size:13px; font-weight:600;
    padding:6px 12px; border:1px solid var(--hairline-strong); border-radius:8px; background:var(--depth);
    cursor:pointer; transition:all 0.15s ease;
  }
  .back-btn:hover{ color:var(--paper); border-color:var(--violet); }
  .clear-btn:hover{ color:var(--coral); border-color:var(--coral); }
  .room-title{ font-family:var(--font-display); font-size:18px; text-transform:uppercase; letter-spacing:0.05em; }

  .chat-messages{ flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px; }
  .message-card{
    max-width:70%; background:var(--depth); border:1px solid var(--hairline);
    border-radius:12px; padding:12px 16px; align-self:flex-start;
  }
  .message-card.self{ align-self:flex-end; background:rgba(139,92,246,0.15); border-color:rgba(139,92,246,0.4); }
  .msg-meta{ display:flex; justify-content:space-between; gap:16px; font-family:var(--font-mono); font-size:11px; margin-bottom:6px; color:var(--violet); }
  .message-card.self .msg-meta{ color:var(--cyan); }
  .msg-time{ color:var(--mist-dim); font-size:10px; }
  .msg-body{ font-size:14px; line-height:1.4; }

  .chat-input-area{ padding:16px 24px; background:var(--depth); border-top:1px solid var(--hairline); display:flex; gap:12px; }
  .chat-input-area input{
    flex:1; background:var(--void); border:1px solid var(--hairline-strong); border-radius:10px;
    padding:12px 16px; color:var(--paper); font-family:inherit; font-size:14px;
  }
  .chat-input-area input:focus{ outline:none; border-color:var(--violet); }
  .send-btn{ background:var(--violet); color:#fff; border:none; border-radius:10px; padding:0 24px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

  <header class="chat-header">
    <div class="header-actions">
      <a href="unsigned-dashboard.html" class="back-btn">← Dashboard</a>
      <button type="button" class="clear-btn" id="clearBtn">Clear Room</button>
    </div>
    <h1 class="room-title" id="roomTitleDisplay">Room</h1>
    <span style="font-family:var(--font-mono); font-size:12px; color:var(--cyan);" id="roomTag">#channel</span>
  </header>

  <main class="chat-messages" id="chatContainer"></main>

  <form class="chat-input-area" id="chatForm">
    <input type="text" id="messageInput" placeholder="Send a live unsigned drop..." required autocomplete="off">
    <button type="submit" class="send-btn">Send</button>
  </form>

<script>
  // 1. Initialize Firebase with your config
  const firebaseConfig = {
    apiKey: "AIzaSyAfrT12DMOws7MMZ-E6BX7dDLjvhbkbmtE",
    authDomain: "project-nox-507c2.firebaseapp.com",
    databaseURL: "https://project-nox-507c2-default-rtdb.firebaseio.com",
    projectId: "project-nox-507c2",
    storageBucket: "project-nox-507c2.firebasestorage.app",
    messagingSenderId: "34710353975",
    appId: "1:34710353975:web:38b006fa895a942b1467b2",
    measurementId: "G-MDC8W9MBJJ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const currentUser = 'GHOST-8842';
  const urlParams = new URLSearchParams(window.location.search);
  const currentRoom = urlParams.get('room') || 'free-talk';
  
  // Reference to this specific room in Firebase Realtime Database
  const roomRef = db.ref('rooms/' + currentRoom);

  document.getElementById('roomTitleDisplay').textContent = currentRoom.replace(/-/g, ' ');
  document.getElementById('roomTag').textContent = `#${currentRoom}`;

  const chatContainer = document.getElementById('chatContainer');
  const chatForm = document.getElementById('chatForm');
  const messageInput = document.getElementById('messageInput');
  const clearBtn = document.getElementById('clearBtn');

  function getFormattedTime() {
    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderMessage(msg) {
    const isSelf = msg.sender === currentUser;
    const div = document.createElement('div');
    div.className = `message-card ${isSelf ? 'self' : ''}`;
    div.innerHTML = `
      <div class="msg-meta">
        <span>${isSelf ? 'YOU (' + msg.sender + ')' : msg.sender}</span>
        <span class="msg-time">${msg.time || 'Just now'}</span>
      </div>
      <div class="msg-body">${msg.text}</div>
    `;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  // 2. Listen for live messages from Firebase Realtime Database
  roomRef.child('messages').on('value', (snapshot) => {
    chatContainer.innerHTML = '';
    const data = snapshot.val();
    
    if (data) {
      Object.values(data).forEach(msg => {
        renderMessage(msg);
      });
    } else {
      renderMessage({ 
        sender: 'SYSTEM', 
        text: `Welcome to the live beginning of #${currentRoom}. Drop a message below!`, 
        time: getFormattedTime() 
      });
    }
  });

  // 3. Send message directly to Firebase
  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text) return;

    roomRef.child('messages').push({
      sender: currentUser,
      text: text,
      time: getFormattedTime()
    });

    messageInput.value = '';
  });

  // 4. Clear room data from database
  clearBtn.addEventListener('click', () => {
    if (confirm('Clear all live messages in this room?')) {
      roomRef.child('messages').remove();
    }
  });
</script>
</body>
</html>
